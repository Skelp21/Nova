[package]
name = "nota"
version = "0.1.0"
description = "Nota — music aggregator player (VK, Yandex Music, YouTube Music, SoundCloud)"
authors = ["Skelp"]
edition = "2021"

[lib]
name = "nota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
axum = "0.7"
futures-util = "0.3"
anyhow = "1"
regex = "1"
url = "2"
urlencoding = "2"
base64 = "0.22"
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
rand = "0.8"

# Desktop only: Discord Rich Presence.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
