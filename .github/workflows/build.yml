# Builds Nota in the cloud: Windows installer + Android APK.
# GitHub → Actions → "Build Nota" → Run workflow. Results: "Artifacts" at the bottom of the run.
name: Build Nota

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  # Optional: add these in Settings → Secrets and variables → Actions
  # so the built apps can sign in to your Supabase project out of the box.
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  windows:
    runs-on: windows-latest   # MSVC is preinstalled here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Nota-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/nota.exe

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android SDK is preinstalled on ubuntu-latest ($ANDROID_HOME).
      - name: Android SDK / NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: Android project
        run: |
          npx tauri android init --ci
          node scripts/patch-android.mjs
      # Debug-signed APK: installs on any phone straight away.
      - run: npx tauri android build --apk --debug --target aarch64
      - name: Collect APK
        run: |
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/Nota.apk \;
      - uses: actions/upload-artifact@v4
        with:
          name: Nota-Android
          path: out/Nota.apk

  ios:
    runs-on: macos-latest   # cloud Mac with Xcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - name: iOS project
        run: npx tauri ios init --ci
      - run: npm run build
      # Build the Rust core ourselves (Tauri's Xcode step needs a signing team).
      - name: Rust for iOS
        working-directory: src-tauri
        run: cargo build --release --target aarch64-apple-ios --lib --features tauri/custom-protocol
      # Unsigned build: Sideloadly / AltStore re-sign it with your Apple ID on install.
      - name: Build unsigned app
        run: |
          APPLE=src-tauri/gen/apple
          LIB=src-tauri/target/aarch64-apple-ios/release/libnota_lib.a
          for cfg in release Release; do
            mkdir -p "$APPLE/Externals/arm64/$cfg"
            cp "$LIB" "$APPLE/Externals/arm64/$cfg/libapp.a"
          done
          PBX=$(find "$APPLE" -name project.pbxproj | head -n 1)
          # Rust is already built: make Xcode's "Build Rust Code" phase a no-op.
          perl -0pi -e 's/shellScript = "(?:[^"\\]|\\.)*?xcode-script(?:[^"\\]|\\.)*";/shellScript = "true";/g' "$PBX"
          grep -c 'shellScript = "true"' "$PBX"
          PROJECT=$(find "$APPLE" -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -project "$PROJECT" -json | python3 -c "import sys,json; s=json.load(sys.stdin)['project']['schemes']; print(next(x for x in s if 'iOS' in x))")
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration release -sdk iphoneos -arch arm64 \
            -archivePath build/Nota.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
      - name: Package .ipa
        run: |
          APP=$(find build/Nota.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n 1)
          mkdir -p Payload out
          cp -R "$APP" Payload/
          zip -qr out/Nota.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Nota-iPhone
          path: out/Nota.ipa
